<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>효TV - 시니어 가상 리모컨</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .remote-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .remote-header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .remote-header h1 {
      font-size: 1.2rem;
      margin: 0 0 6px 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .remote-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    /* 🔴🟢⚪ 메인 대형 버튼 레이아웃 */
    .hero-buttons-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 4px 0;
    }

    .large-remote-btn {
      width: 100%;
      height: 115px;
      border-radius: 24px;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.1s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .large-remote-btn:active {
      transform: scale(0.96);
    }

    /* 초록 버튼 */
    .btn-green-main {
      background: linear-gradient(135deg, #10b981, #059669);
      border: 2px solid #34d399;
      color: #ffffff;
    }

    /* 빨강 버튼 */
    .btn-red-main {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: 2px solid #f87171;
      color: #ffffff;
    }

    /* 흰색 대형 119 긴급 호출 버튼 */
    .btn-white-main {
      background: #ffffff;
      border: 3px solid #dc2626;
      color: #dc2626;
      height: 120px;
    }

    .btn-white-main:active {
      background: #f8fafc;
    }

    .btn-main-title {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-119-title {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #dc2626;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-main-sub {
      font-size: 0.875rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .btn-119-sub {
      font-size: 0.9rem;
      font-weight: 700;
      color: #991b1b;
    }

    /* 🎙️ 음성 인식 마이크 카드 */
    .voice-control-card {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .mic-button {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #2563eb;
      border: none;
      color: #ffffff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      flex-shrink: 0;
    }

    .mic-button.listening {
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .voice-hint-box {
      text-align: left;
    }

    .voice-hint-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 2px 0;
    }

    .voice-hint-sub {
      font-size: 0.775rem;
      color: #94a3b8;
      margin: 0;
    }

    #remote-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    #remote-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="remote-container">
    <!-- 헤더 영역 -->
    <header class="remote-header">
      <h1>📺 효TV 가상 리모컨</h1>
      <div class="remote-status-badge">
        <div class="status-dot"></div>
        <span id="connection-status">TV 화면 연동됨</span>
      </div>
    </header>

    <!-- 🟢🔴⚪ 메인 리모컨 버튼 3종 구성 -->
    <div class="hero-buttons-container">
      <!-- 🟢 초록 버튼 -->
      <button class="large-remote-btn btn-green-main" onclick="sendAction('BTN_GREEN')">
        <div class="btn-main-title">
          <span>🟢</span>
          <span>확인 / 수락 / 먹었어</span>
        </div>
        <div class="btn-main-sub">아침 인사 대답 · 복약 먹었어 · 영상통화 수락</div>
      </button>

      <!-- 🔴 빨강 버튼 -->
      <button class="large-remote-btn btn-red-main" onclick="sendAction('BTN_RED')">
        <div class="btn-main-title">
          <span>🔴</span>
          <span>거절 / 나중에 / 통화종료</span>
        </div>
        <div class="btn-main-sub">복약 나중에 · 영상통화 거절 · 통화 종료</div>
      </button>

      <!-- ⚪ 흰색 버튼: 119 긴급 구조 -->
      <button class="large-remote-btn btn-white-main" onclick="sendAction('BTN_119')">
        <div class="btn-119-title">
          <span>🚨</span>
          <span>119</span>
        </div>
        <div class="btn-119-sub">119 긴급 구조 요청 발송</div>
      </button>
    </div>

    <!-- 🎙️ 시니어 음성 명령 카드 -->
    <div class="voice-control-card">
      <button id="mic-btn" class="mic-button" onclick="toggleVoiceRecognition()">
        🎙️
      </button>
      <div class="voice-hint-box">
        <div class="voice-hint-title" id="voice-hint-title">음성으로 대답하기</div>
        <div class="voice-hint-sub" id="voice-hint-text">
          "먹었어", "수락", "나중에", "119"
        </div>
      </div>
    </div>
  </div>

  <div id="remote-toast">신호가 TV로 전송되었습니다!</div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="js/remote.js"></script>
</body>
</html>
