<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>효TV - 시니어 2버튼 리모컨</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .remote-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .remote-header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .remote-header h1 {
      font-size: 1.2rem;
      margin: 0 0 6px 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .remote-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    /* 🎙️ 음성 인식 마이크 카드 */
    .voice-control-card {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      display: flex;
      flex-direction: flex-row;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .mic-button {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #2563eb;
      border: none;
      color: #ffffff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      flex-shrink: 0;
    }

    .mic-button.listening {
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .voice-hint-box {
      text-align: left;
    }

    .voice-hint-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 2px 0;
    }

    .voice-hint-sub {
      font-size: 0.775rem;
      color: #94a3b8;
      margin: 0;
    }

    /* 🔴🟢 초록/빨강 시니어 2버튼 전용 레이아웃 */
    .hero-buttons-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 4px 0;
    }

    .large-remote-btn {
      width: 100%;
      height: 120px;
      border-radius: 24px;
      border: none;
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.1s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .large-remote-btn:active {
      transform: scale(0.96);
    }

    /* 초록 버튼 (긍정 / 먹었어 / 수락 / 대답) */
    .btn-green-main {
      background: linear-gradient(135deg, #10b981, #059669);
      border: 2px solid #34d399;
    }
    .btn-green-main:active {
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.5);
    }

    /* 빨강 버튼 (부정 / 나중에 / 거절 / 통화종료) */
    .btn-red-main {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: 2px solid #f87171;
    }
    .btn-red-main:active {
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.5);
    }

    .btn-main-title {
      font-size: 1.75rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-main-sub {
      font-size: 0.875rem;
      font-weight: 500;
      opacity: 0.9;
    }

    /* TV 화면 페이지 이동 버튼 구역 */
    .remote-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 12px 16px;
    }

    .section-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .page-nav-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-nav-small {
      padding: 10px 4px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .btn-nav-small:active {
      background: #0284c7;
      color: #ffffff;
    }

    #remote-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    #remote-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="remote-container">
    <!-- 헤더 영역 -->
    <header class="remote-header">
      <h1>📺 효TV 2버튼 전용 리모컨</h1>
      <div class="remote-status-badge">
        <div class="status-dot"></div>
        <span id="connection-status">TV 화면 연동됨</span>
      </div>
    </header>

    <!-- 🟢🔴 메인 2개 대형 통합 버튼 -->
    <div class="hero-buttons-container">
      <!-- 초록 버튼 -->
      <button class="large-remote-btn btn-green-main" onclick="sendAction('BTN_GREEN')">
        <div class="btn-main-title">
          <span>🟢</span>
          <span>확인 / 수락 / 먹었어</span>
        </div>
        <div class="btn-main-sub">아침 인사 대답 · 복약 먹었어 · 영상통화 수락</div>
      </button>

      <!-- 빨강 버튼 -->
      <button class="large-remote-btn btn-red-main" onclick="sendAction('BTN_RED')">
        <div class="btn-main-title">
          <span>🔴</span>
          <span>거절 / 나중에 / 통화종료</span>
        </div>
        <div class="btn-main-sub">복약 나중에 · 영상통화 거절 · 통화 종료</div>
      </button>
    </div>

    <!-- 🎙️ 시니어 음성 명령 카드 -->
    <div class="voice-control-card">
      <button id="mic-btn" class="mic-button" onclick="toggleVoiceRecognition()">
        🎙️
      </button>
      <div class="voice-hint-box">
        <div class="voice-hint-title" id="voice-hint-title">음성으로 대답하기</div>
        <div class="voice-hint-sub" id="voice-hint-text">
          "먹었어", "수락", "나중에", "종료"
        </div>
      </div>
    </div>

    <!-- 📺 TV 화면 이동 카테고리 -->
    <div class="remote-section">
      <div class="section-title">📺 TV 화면 이동</div>
      <div class="page-nav-grid">
        <button class="btn-nav-small" onclick="sendAction('NAV_OVERVIEW')">소개</button>
        <button class="btn-nav-small" onclick="sendAction('NAV_MORNING')">아침인사</button>
        <button class="btn-nav-small" onclick="sendAction('NAV_MEDICATION')">복약알림</button>
        <button class="btn-nav-small" onclick="sendAction('NAV_VIDEOCALL')">영상통화</button>
      </div>
    </div>
  </div>

  <div id="remote-toast">신호가 TV로 전송되었습니다!</div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="js/remote.js"></script>
</body>
</html>
