<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>효TV - 시니어 가상 리모컨</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .remote-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .remote-header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .remote-header h1 {
      font-size: 1.2rem;
      margin: 0 0 6px 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .remote-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    /* 🟢🔴🔵⚪ 메인 4종 대형 리모컨 버튼 레이아웃 */
    .hero-buttons-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 4px 0;
    }

    .large-remote-btn {
      width: 100%;
      height: 110px;
      border-radius: 22px;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.1s, box-shadow 0.15s, background-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .large-remote-btn:active {
      transform: scale(0.96);
    }

    /* 초록 버튼 */
    .btn-green-main {
      background: linear-gradient(135deg, #10b981, #059669);
      border: 2px solid #34d399;
      color: #ffffff;
    }

    /* 빨강 버튼 */
    .btn-red-main {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: 2px solid #f87171;
      color: #ffffff;
    }

    /* 파랑 마이크 버튼 */
    .btn-blue-main {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 2px solid #60a5fa;
      color: #ffffff;
    }

    .btn-blue-main.listening {
      background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
      border-color: #fca5a5 !important;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* 흰색 대형 119 긴급 호출 버튼 */
    .btn-white-main {
      background: #ffffff;
      border: 3px solid #dc2626;
      color: #dc2626;
      height: 115px;
    }

    .btn-white-main:active {
      background: #f8fafc;
    }

    .btn-main-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-119-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #dc2626;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-main-sub {
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0.92;
    }

    .btn-119-sub {
      font-size: 0.875rem;
      font-weight: 700;
      color: #991b1b;
    }

    #remote-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    #remote-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="remote-container">
    <!-- 헤더 영역 -->
    <header class="remote-header">
      <h1>📺 효TV 가상 리모컨</h1>
      <div class="remote-status-badge">
        <div class="status-dot"></div>
        <span id="connection-status">TV 화면 연동됨</span>
      </div>
    </header>

    <!-- 🟢🔴🔵⚪ 메인 리모컨 버튼 4종 구성 -->
    <div class="hero-buttons-container">
      <!-- 1. 🟢 초록 버튼 -->
      <button class="large-remote-btn btn-green-main" onclick="sendAction('BTN_GREEN')">
        <div class="btn-main-title">
          <span>🟢</span>
          <span>확인 / 수락 / 먹었어</span>
        </div>
        <div class="btn-main-sub">아침 인사 대답 · 복약 먹었어 · 영상통화 수락</div>
      </button>

      <!-- 2. 🔴 빨강 버튼 -->
      <button class="large-remote-btn btn-red-main" onclick="sendAction('BTN_RED')">
        <div class="btn-main-title">
          <span>🔴</span>
          <span>거절 / 나중에 / 통화종료</span>
        </div>
        <div class="btn-main-sub">복약 나중에 · 영상통화 거절 · 통화 종료</div>
      </button>

      <!-- 3. 🔵 파란색 마이크 버튼 (위치 위로 이동 + 파란색 대형 버튼 디자인) -->
      <button id="mic-btn" class="large-remote-btn btn-blue-main" onclick="toggleVoiceRecognition()">
        <div class="btn-main-title">
          <span>🎙️</span>
          <span id="mic-btn-title">음성으로 대답하기</span>
        </div>
        <div class="btn-main-sub" id="voice-hint-text">누르고 말하기 ('먹었어', '수락', '나중에', '119')</div>
      </button>

      <!-- 4. ⚪ 흰색 119 버튼 (위치 아래로 이동) -->
      <button class="large-remote-btn btn-white-main" onclick="sendAction('BTN_119')">
        <div class="btn-119-title">
          <span>🚨</span>
          <span>119</span>
        </div>
        <div class="btn-119-sub">119 긴급 구조 요청 발송</div>
      </button>
    </div>
  </div>

  <div id="remote-toast">신호가 TV로 전송되었습니다!</div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="js/remote.js"></script>
</body>
</html>
