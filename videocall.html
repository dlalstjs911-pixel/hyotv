<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>효TV - 영상통화 수신 화면</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- 🔊 최상위 전역 플로팅 스피커 켜기 버튼 -->
  <button id="global-floating-audio-btn" class="global-floating-audio-btn" onclick="unlockAudioSystem(); showToast('🔊 TV 스피커 및 음성(TTS)이 활성화되었습니다.', '🔊');" title="스피커 소리 활성화">
    <span class="audio-btn-icon">🔊</span>
    <span class="audio-btn-label">스피커 켜기</span>
  </button>

  <div class="tv-screen">
    <!-- 상단 네비게이션 컨트롤러 -->
    <nav class="tv-nav">
      <a href="index.html" class="tv-nav-item"><span class="key-badge">Home</span> 전체보기</a>
      <a href="morning.html" class="tv-nav-item"><span class="key-badge">1</span> 아침 인사</a>
      <a href="medication.html" class="tv-nav-item"><span class="key-badge">2</span> 복약 알림</a>
      <a href="videocall.html" class="tv-nav-item active"><span class="key-badge">3</span> 통화수신</a>

      <div class="tv-nav-right">
        <button id="tv-audio-toggle-btn" class="tv-nav-audio-btn" onclick="unlockAudioSystem(); showToast('🔊 TV 스피커가 활성화되었습니다.', '🔊');" title="스피커 활성화">
          <span>🔊 스피커 켜기</span>
        </button>
        <a href="remote.html" target="_blank" class="tv-nav-remote-btn">
          📱 리모컨 열기
        </a>
      </div>
    </nav>

    <!-- 토스트 알림 컨테이너 -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 메인 화면 -->
    <main class="screen-videocall">
      <div class="videocall-container">
        <div class="videocall-avatar-outer">
          <div class="videocall-avatar-inner">
            <img src="assets/images/daughter_avatar.png" alt="딸 지영 라이브 화면">
          </div>
          <div class="live-camera-tag">
            <div class="live-dot"></div>
            <span>라이브 카메라</span>
          </div>
        </div>

        <div class="videocall-actions">
          <button class="btn-call accept" onclick="unlockAudioSystem(); window.location.href='index.html#videocall';">
            <div class="call-icon-circle">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
              </svg>
            </div>
            <span>수락</span>
          </button>

          <button class="btn-call decline" onclick="window.location.href='index.html';">
            <div class="call-icon-circle">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67 19.42 19.42 0 0 1-2.67-3.33 19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
                <line x1="23" y1="1" x2="1" y2="23"/>
              </svg>
            </div>
            <span>거절</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/supabase.js"></script>
</body>
</html>
